name: Build iOS unsigned IPA

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: |
          xcodebuild -project tethered/ios-app/OsuTablet.xcodeproj \
            -scheme OsuTablet \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            build
      - name: Package unsigned ipa
        run: |
          APP=$(find ~/Library/Developer/Xcode/DerivedData -name "OsuTablet.app" | head -1)
          mkdir -p Payload && cp -r "$APP" Payload/
          zip -qr OsuTablet-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: OsuTablet-unsigned.ipa
