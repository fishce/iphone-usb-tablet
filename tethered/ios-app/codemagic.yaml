workflows:
  unsigned-ipa:
    name: Build unsigned iOS app
    instance_type: mac_mini_m2
    scripts:
      - name: Build
        script: |
          xcodebuild -project tethered/ios-app/OsuTablet.xcodeproj \
            -scheme OsuTablet \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            build
      - name: Package ipa
        script: |
          APP=$(find ~/Library/Developer/Xcode/DerivedData -name "OsuTablet.app" | head -1)
          mkdir -p Payload && cp -r "$APP" Payload/
          zip -qr OsuTablet-unsigned.ipa Payload
    artifacts:
      - OsuTablet-unsigned.ipa
